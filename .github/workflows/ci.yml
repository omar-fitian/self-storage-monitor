name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -v

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shiny
            any::shinydashboard
            any::dplyr
            any::tidyr
            any::readr
            any::DT
            any::leaflet
            any::plotly

      - name: Check the app loads and the data is readable
        working-directory: dashboard
        run: |
          Rscript -e '
            for (f in list.files("R", full.names = TRUE)) source(f)
            source("app.R")
            units <- load_units(LOCAL_UNITS)
            stopifnot(nrow(units) > 0, inherits(units$date, "Date"),
                      is.function(server), !is.null(ui))
            cat("Dashboard loads:", nrow(units), "units across",
                length(unique(units$date)), "capture dates\n")
          '